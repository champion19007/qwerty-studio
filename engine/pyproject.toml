[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qwerty-engine"
version = "0.1.0"
description = "Coherent browser fingerprint & profile engine for QWERTY."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahsan" }]
keywords = [
    "browser", "fingerprint", "profile-manager", "anti-detect",
    "multi-account", "privacy", "automation", "playwright",
    "camoufox", "cloakbrowser", "patchright",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/champion19007/qwerty-studio"
Source = "https://github.com/champion19007/qwerty-studio"
Issues = "https://github.com/champion19007/qwerty-studio/issues"

[project.optional-dependencies]
launch = ["playwright>=1.40"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
secure = ["cryptography>=42.0"]
# The dev extra pulls in the API stack too, so the CORS guard tests in
# tests/test_server.py actually run in CI instead of silently skipping.
dev = ["pytest>=7.0", "cryptography>=42.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
qwerty = "qwerty.cli:main"

[tool.setuptools.packages.find]
include = ["qwerty*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
